[workspace]
members = ["core", "capi", "py"]
resolver = "3"

[workspace.package]
version = "0.7.0"
edition = "2024"
rust-version = "1.97"
license = "MIT OR Apache-2.0"
repository = "https://github.com/edge-wave/edge-ear"
authors = ["The edge-ear Authors"]

[workspace.dependencies]
# No backend by default. The backend is a trait, so each wrapper
# names the one it wants through its own features; inheriting a
# default here would pin every wrapper to cpal.
edge-ear-core = { path = "core", version = "0.7.0", default-features = false }

pipewire-flow = { git = "https://github.com/pipewire-flow/pipewire-flow-rs", rev = "c053e7269738f4833ffcb1f7a7e7598cd35c18b5", version = "0.2.0", default-features = false }
cpal = "0.18.1"
rubato = "5.0.0"
symphonia = { version = "0.6.1", default-features = false, features = [
    "wav",
    "ogg",
    "vorbis",
    "pcm",
] }
log = "0.4"
env_logger = { version = "0.11", default-features = false, features = ["auto-color", "humantime"] }
thiserror = "2"
libc = "0.2"

# Pinned exactly. ort has no stable release and its release candidates
# change behaviour, so a caret range could break the build silently.
ort = "=2.0.0-rc.13"

pyo3 = "0.29.2"
pyo3-build-config = "0.29.2"
pyo3-log = "0.13.4"

# The dylib carries a statically linked onnxruntime, so its symbol
# table is worth about a quarter of the artifact.
[profile.release]
strip = true
