[package]
name = "edge-ear-core"
description = "Local real-time audio front end: capture, wake word, speech detection, playback"
keywords = ["audio", "wake-word", "vad", "microphone", "realtime"]
categories = ["multimedia::audio"]
readme = "../README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
default = ["cpal-backend"]
# The default way to reach the microphone and speaker. Turning it off
# leaves the backend trait in place, so another implementation can take
# over without dragging ALSA or CoreAudio in.
cpal-backend = ["dep:cpal"]
tinypipewire-backend = ["dep:tinypipewire", "dep:libc"]

[dependencies]
cpal = { workspace = true, optional = true }
log.workspace = true
rubato.workspace = true
symphonia.workspace = true
thiserror.workspace = true
ort.workspace = true

# PipeWire only exists on Linux, so --all-features elsewhere must not try
# to build the bindings.
[dev-dependencies]
env_logger.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
tinypipewire = { workspace = true, optional = true }
# PipeWire times playback on CLOCK_MONOTONIC, which std cannot read out.
libc = { workspace = true, optional = true }
