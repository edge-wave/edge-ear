[package]
name = "edge-ear-capi"
description = "C API for edge-ear."
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
crate-type = ["rlib", "cdylib", "staticlib"]

[features]
default = ["cpal-backend"]
# The device backend this C library is built against. Exactly one is
# normally on: core falls back to tinypipewire in `new()` only when
# cpal is off.
cpal-backend = ["edge-ear-core/cpal-backend"]
tinypipewire-backend = ["edge-ear-core/tinypipewire-backend"]
webrtc-aec = ["edge-ear-core/webrtc-aec"]

[dependencies]
edge-ear-core.workspace = true
log.workspace = true
