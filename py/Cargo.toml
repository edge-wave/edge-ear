[package]
name = "edge-ear-py"
description = "Python binding for edge-ear"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
name = "edge_ear"
crate-type = ["cdylib", "rlib"]

[features]
default = ["cpal-backend"]
# The device backend this extension module is built against. Exactly one is
# normally on: core falls back to tinypipewire in `new()` only when
# cpal is off.
cpal-backend = ["edge-ear-core/cpal-backend"]
tinypipewire-backend = ["edge-ear-core/tinypipewire-backend"]
webrtc-aec = ["edge-ear-core/webrtc-aec"]

[dependencies]
edge-ear-core.workspace = true
log.workspace = true
pyo3 = { workspace = true, features = ["extension-module", "abi3-py39"] }
pyo3-log.workspace = true

[build-dependencies]
pyo3-build-config.workspace = true
